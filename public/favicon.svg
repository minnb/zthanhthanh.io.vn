<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Nền điện ảnh ấm áp -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241814"/>
      <stop offset="50%" stop-color="#1B1210"/>
      <stop offset="100%" stop-color="#100A09"/>
    </linearGradient>

    <!-- Viền ánh đồng thau cổ điển -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C388"/>
      <stop offset="50%" stop-color="#8E1F2F"/>
      <stop offset="100%" stop-color="#B08D57"/>
    </linearGradient>

    <!-- Màu vàng đồng / Golden Reel -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DCAC"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A57D38"/>
    </linearGradient>

    <!-- Màu đỏ Ruby phim trường (REC / Passion) -->
    <radialGradient id="recGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="40%" stop-color="#C9184A"/>
      <stop offset="85%" stop-color="#800F2F"/>
      <stop offset="100%" stop-color="#590D22" stop-opacity="0"/>
    </radialGradient>

    <!-- Ánh sáng kim loại cho ngòi bút chữ T -->
    <linearGradient id="tFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="recDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF3366" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Khung Squircle bo góc sang trọng (tỉ lệ icon hiện đại) -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#subtleGlow)"/>

  <!-- VÒNG CUNG BÁNH XE LĂN & CUỘN PHIM (The Resilient Wheel & Film Spool) -->
  <!-- Vành bánh xe chính (tượng trưng cho sự chuyển động không ngừng về phía trước) -->
  <g transform="translate(256, 266)">
    <!-- Vành ngoài bánh xe / Film track mờ -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>
    
    <!-- Các lỗ răng cưa phim nhựa (35mm Film Perforations) trên vành bánh xe -->
    <!-- Phân bố đối xứng tạo cảm giác cuộn phim điện ảnh đang quay -->
    <g fill="url(#goldGrad)" opacity="0.45">
      <circle cx="0" cy="-148" r="4.5"/>
      <circle cx="56" cy="-136" r="4.5"/>
      <circle cx="104" cy="-104" r="4.5"/>
      <circle cx="136" cy="-56" r="4.5"/>
      <circle cx="148" cy="0" r="4.5"/>
      <circle cx="136" cy="56" r="4.5"/>
      <circle cx="104" cy="104" r="4.5"/>
      <circle cx="56" cy="136" r="4.5"/>
      <circle cx="0" cy="148" r="4.5"/>
      <circle cx="-56" cy="136" r="4.5"/>
      <circle cx="-104" cy="104" r="4.5"/>
      <circle cx="-136" cy="56" r="4.5"/>
      <circle cx="-148" cy="0" r="4.5"/>
      <circle cx="-136" cy="-56" r="4.5"/>
      <circle cx="-104" cy="-104" r="4.5"/>
      <circle cx="-56" cy="-136" r="4.5"/>
    </g>

    <!-- Vòng chuyển động mạnh mẽ (Dynamic Forward Arc) -->
    <!-- Mở góc phía trước tượng trưng cho sự bứt phá khỏi giới hạn -->
    <path d="M -132 50 A 142 142 0 1 0 50 -132" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Nan hoa bánh xe cách điệu (Hub & Spokes of the Wheel) -->
    <path d="M 0 0 L -86 86" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 0 0 L -120 -20" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 0 0 L 86 86" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Trục tâm bánh xe (Center Bearing / Film Hub) -->
    <circle cx="0" cy="0" r="22" fill="#1B1210" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="8" fill="url(#goldGrad)"/>
  </g>

  <!-- CHỮ LỒNG "TT" & NGÒI BÚT BIÊN KỊCH (Editorial Monogram) -->
  <g filter="url(#subtleGlow)">
    <!-- Chữ T thứ hai (T2 - Lớp sau, màu vàng đồng ánh kim tượng trưng cho vinh danh / giải thưởng) -->
    <g transform="translate(36, 24)" opacity="0.9">
      <!-- Thanh ngang chữ T sau -->
      <path d="M 170 148 L 320 148 C 326 148 330 152 330 158 L 330 170 C 330 176 326 180 320 180 L 262 180 L 262 310 C 262 322 250 330 240 330 C 230 330 218 322 218 310 L 218 180 L 170 180 C 164 180 160 176 160 170 L 160 158 C 160 152 164 148 170 148 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Chữ T thứ nhất (T1 - Lớp trước, màu trắng ngà giấy kịch bản & ngòi bút sắc sảo) -->
    <g transform="translate(-16, -10)">
      <!-- Thanh ngang của chữ T chính: Thiết kế dứt khoát như thanh Clapperboard -->
      <path d="M 148 152 C 148 144 154 138 162 138 L 334 138 C 342 138 348 144 348 152 L 348 166 C 348 174 342 180 334 180 L 268 180 L 268 284 L 248 326 L 228 284 L 228 180 L 162 180 C 154 180 148 174 148 166 Z" fill="url(#tFrontGrad)" stroke="#1B1210" stroke-width="3"/>
      
      <!-- Đường xẻ rãnh ngòi bút máy (Fountain Pen Slit) chính giữa thân chữ T -->
      <line x1="248" y1="210" x2="248" y2="310" stroke="#8E1F2F" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="248" cy="204" r="3.5" fill="#8E1F2F"/>
    </g>
  </g>

  <!-- ĐÈN "REC" ĐIỆN ẢNH & NGỌN LỬA ĐAM MÊ (The Crimson REC Light) -->
  <!-- Đặt tại góc trên bên phải: Báo hiệu thước phim đang quay, câu chuyện bắt đầu cất tiếng -->
  <g transform="translate(372, 116)" filter="url(#recDrop)">
    <circle cx="0" cy="0" r="24" fill="url(#recGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#E6194B"/>
    <circle cx="-4" cy="-4" r="5" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
